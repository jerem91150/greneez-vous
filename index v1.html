<!DOCTYPE html>
<html lang="fr">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Police 'Serif' élégante pour les titres -->

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .font-editorial {
            font-family: 'Playfair Display', serif;
        }

        /* Animation du bandeau défilant */
        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          animation: marquee 30s linear infinite;
        }
        
        /* Masquer la scrollbar pour un look plus propre */
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;

    <!-- React & ReactDOM -->

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel pour comprendre le code JSX -->

</head>
<body class="bg-[#FDFCF8] text-stone-800 antialiased selection:bg-emerald-200 selection:text-emerald-900">

    <div id="root"></div>

                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round"

            </IconWrapper>
        );

            <IconWrapper {...props}>
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </IconWrapper>
        );
        const MoveRight = (props) => (
            <IconWrapper {...props}>
                <path d="M18 8L22 12L18 16"/><path d="M2 12H22"/>

        );

            <IconWrapper {...props}>
