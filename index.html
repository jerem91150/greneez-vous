const User = (props) => (<IconWrapper {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>);
const Package = (props) => (<IconWrapper {...props}><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></IconWrapper>);

const Tag = (props) => (<IconWrapper {...props}><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></IconWrapper>);
const ShoppingCart = (props) => (<IconWrapper {...props}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></IconWrapper>);
const Eye = (props) => (<IconWrapper {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconWrapper>);
const Search = (props) => (<IconWrapper {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>);
const Check = (props) => (<IconWrapper {...props}><polyline points="20 6 9 17 4 12"/></IconWrapper>);
const MapPin = (props) => (<IconWrapper {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>);
const CreditCard = (props) => (<IconWrapper {...props}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></IconWrapper>);
const Truck = (props) => (<IconWrapper {...props}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></IconWrapper>);
const BarChart = (props) => (<IconWrapper {...props}><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></IconWrapper>);

// DONNEES - PRODUITS GREENEZ VOUS
const initialCategories = [
    { id: 1, name: "Salle de Bain", slug: "salle-de-bain" },
    { id: 2, name: "Accessoires Cheveux", slug: "accessoires-cheveux" },
    { id: 3, name: "Douche", slug: "douche" },
    { id: 4, name: "Vrac & Cuisine", slug: "vrac-cuisine" }
];

const initialProducts = [
    { id: 1, name: "Mini serviette visage", subtitle: "Motifs fleuris", description: "Mini serviette lavable pour le visage, ideale pour se demaquiller ou se rafraichir. Tissu doux et absorbant, lavable en machine. Fait main en France.", price: 6.00, stock: 30, categoryId: 1, image: "https://images.unsplash.com/photo-1596436665715-c274439c3621?auto=format&fit=crop&q=80&w=600", tag: "Best-seller", active: true },
    { id: 2, name: "Mini serviette Toile de Jouy bleue", subtitle: "Motif Toile de Jouy", description: "Mini serviette visage au motif Toile de Jouy bleue, elegante et douce. Parfaite pour vos rituels beaute quotidiens.", price: 6.00, stock: 25, categoryId: 1, image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&q=80&w=600", tag: null, active: true },
    { id: 3, name: "Mini serviette Toile de Jouy rouge", subtitle: "Motif Toile de Jouy", description: "Mini serviette visage au motif Toile de Jouy rouge, elegante et douce. Un accessoire zero dechet indispensable.", price: 6.00, stock: 20, categoryId: 1, image: "https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&q=80&w=600", tag: null, active: true },
    { id: 4, name: "Mini gant lavable micro eponge", subtitle: "Micro eponge douce", description: "Mini gant lavable en micro eponge, parfait pour nettoyer le visage en douceur. Texture ultra douce.", price: 4.00, stock: 40, categoryId: 1, image: "https://images.unsplash.com/photo-1596436665715-c274439c3621?auto=format&fit=crop&q=80&w=600", tag: "Nouveau", active: true },
    { id: 5, name: "Mini gant eponge de bambou", subtitle: "Eponge de bambou", description: "Mini gant en micro eponge de bambou, naturellement antibacterien et ultra absorbant.", price: 4.00, stock: 35, categoryId: 1, image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&q=80&w=600", tag: null, active: true },
    { id: 6, name: "Bandeau de soins cheveux", subtitle: "Motifs varies", description: "Bandeau elastique pour maintenir vos cheveux pendant vos soins visage. Tissu doux et confortable.", price: 12.00, stock: 25, categoryId: 2, image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&q=80&w=600", tag: "Best-seller", active: true },
    { id: 7, name: "Chouchou Toile de Jouy rouge", subtitle: "Tissu upcycle", description: "Chouchou elegant au motif Toile de Jouy rouge, realise a partir de chutes de tissu. Piece unique.", price: 5.00, stock: 50, categoryId: 2, image: "https://images.unsplash.com/photo-1616406432452-07bc5928a55c?auto=format&fit=crop&q=80&w=600", tag: null, active: true },
    { id: 8, name: "Chouchou Toile de Jouy vert", subtitle: "Tissu upcycle", description: "Chouchou elegant au motif Toile de Jouy vert, realise a partir de chutes de tissu. Eco-responsable.", price: 5.00, stock: 45, categoryId: 2, image: "https://images.unsplash.com/photo-1616406432452-07bc5928a55c?auto=format&fit=crop&q=80&w=600", tag: null, active: true },
    { id: 9, name: "Fleur de douche", subtitle: "Micro eponge douce", description: "Fleur de douche lavable et reutilisable en micro eponge. Alternative zero dechet. Mousse genereusement.", price: 8.00, stock: 30, categoryId: 3, image: "https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&q=80&w=600", tag: "Populaire", active: true },
    { id: 10, name: "Circuit de poche", subtitle: "Jeu de voyage", description: "Circuit de poche fait main, parfait pour occuper les enfants en voyage. Tissu resistant et lavable.", price: 20.00, stock: 15, categoryId: 4, image: "https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&q=80&w=600", tag: "Piece unique", active: true },
    { id: 11, name: "Pochon anti-gaspi coton bio", subtitle: "Coton bio certifie", description: "Pochon en coton bio pour conserver vos restes de pain ou vos fruits. Lavable et reutilisable.", price: 6.00, stock: 40, categoryId: 4, image: "https://images.unsplash.com/photo-1605335804344-9694e80e1a17?auto=format&fit=crop&q=80&w=600", tag: "Eco-responsable", active: true },
    { id: 12, name: "Pochon produits solides", subtitle: "Lin lave naturel", description: "Pochon ideal pour ranger vos cosmetiques solides. Tissu respirant qui permet le sechage.", price: 6.00, stock: 35, categoryId: 4, image: "https://images.unsplash.com/photo-1605335804344-9694e80e1a17?auto=format&fit=crop&q=80&w=600", tag: null, active: true }
];

const initialEvents = [
    { id: 1, title: "Marche de Noel Artisanal", description: "Retrouvez-nous au marche de Noel de Lyon, place Bellecour.", date: "2024-12-15", location: "Lyon, Place Bellecour", active: true },
    { id: 2, title: "Atelier Couture Zero Dechet", description: "Apprenez a coudre vos propres lingettes ! Places limitees.", date: "2024-12-20", location: "Atelier Greenez Vous, Lyon 3e", active: true },
    { id: 3, title: "Marche des Createurs", description: "Greenez Vous sera present au marche des createurs.", date: "2025-01-18", location: "Villeurbanne", active: true }
];

const initialPromos = [
    { id: 1, code: "BIENVENUE10", discount: 10, type: "percent", minOrder: 0, active: true, usageCount: 45, maxUsage: 100 },
    { id: 2, code: "NOEL2024", discount: 15, type: "percent", minOrder: 25, active: true, usageCount: 12, maxUsage: 50 },
    { id: 3, code: "ZERODECHET", discount: 5, type: "fixed", minOrder: 30, active: true, usageCount: 8, maxUsage: 30 }
];

// HELPERS
const getStoredData = (key, defaultValue) => { try { const stored = localStorage.getItem(key); return stored ? JSON.parse(stored) : defaultValue; } catch { return defaultValue; } };
const setStoredData = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

// CONTEXTE
const AppContext = createContext();
const AppProvider = ({ children }) => {
    const [page, setPage] = useState('home');
    const [selectedProduct, setSelectedProduct] = useState(null);
    const [selectedCategory, setSelectedCategory] = useState(null);
    const [cart, setCart] = useState(() => getStoredData('greenez_cart', []));
    const [products, setProducts] = useState(() => getStoredData('greenez_products', initialProducts));
    const [categories] = useState(initialCategories);
    const [events, setEvents] = useState(() => getStoredData('greenez_events', initialEvents));
    const [promos, setPromos] = useState(() => getStoredData('greenez_promos', initialPromos));
    const [orders, setOrders] = useState(() => getStoredData('greenez_orders', []));
    const [isAdmin, setIsAdmin] = useState(() => getStoredData('greenez_admin', false));
    const [cartOpen, setCartOpen] = useState(false);
    const [notification, setNotification] = useState(null);
    const [appliedPromo, setAppliedPromo] = useState(null);

    useEffect(() => { setStoredData('greenez_cart', cart); }, [cart]);
    useEffect(() => { setStoredData('greenez_products', products); }, [products]);
    useEffect(() => { setStoredData('greenez_events', events); }, [events]);
    useEffect(() => { setStoredData('greenez_promos', promos); }, [promos]);
    useEffect(() => { setStoredData('greenez_orders', orders); }, [orders]);
    useEffect(() => { setStoredData('greenez_admin', isAdmin); }, [isAdmin]);

    const showNotification = (message, type = 'success') => { setNotification({ message, type }); setTimeout(() => setNotification(null), 3000); };
    const addToCart = (product, qty = 1) => { setCart(prev => { const existing = prev.find(item => item.id === product.id); if (existing) { return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + qty } : item); } return [...prev, { ...product, quantity: qty }]; }); showNotification(product.name + ' ajoute au panier !'); };
    const removeFromCart = (productId) => setCart(prev => prev.filter(item => item.id !== productId));
    const updateCartQuantity = (productId, qty) => { if (qty <= 0) { removeFromCart(productId); return; } setCart(prev => prev.map(item => item.id === productId ? { ...item, quantity: qty } : item)); };
    const clearCart = () => setCart([]);
    const cartTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

    const applyPromoCode = (code) => { const promo = promos.find(p => p.code.toUpperCase() === code.toUpperCase() && p.active && p.usageCount < p.maxUsage); if (promo) { if (cartTotal >= promo.minOrder) { setAppliedPromo(promo); showNotification('Code promo ' + promo.code + ' applique !'); return true; } else { showNotification('Commande minimum de ' + promo.minOrder + ' EUR requise', 'error'); return false; } } showNotification('Code promo invalide', 'error'); return false; };
    const getDiscountedTotal = () => { if (!appliedPromo) return cartTotal; if (appliedPromo.type === 'percent') return cartTotal * (1 - appliedPromo.discount / 100); return Math.max(0, cartTotal - appliedPromo.discount); };
    const placeOrder = (customerInfo) => { const newOrder = { id: Date.now(), items: [...cart], customer: customerInfo, total: getDiscountedTotal(), promoUsed: appliedPromo?.code || null, status: 'pending', date: new Date().toISOString() }; setOrders(prev => [...prev, newOrder]); if (appliedPromo) { setPromos(prev => prev.map(p => p.id === appliedPromo.id ? { ...p, usageCount: p.usageCount + 1 } : p)); } clearCart(); setAppliedPromo(null); showNotification('Commande validee ! Merci pour votre achat.'); setPage('home'); return newOrder; };

    const addProduct = (product) => { setProducts(prev => [...prev, { ...product, id: Date.now(), active: true }]); showNotification('Produit ajoute !'); };
    const updateProduct = (id, updates) => { setProducts(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p)); showNotification('Produit mis a jour !'); };
    const deleteProduct = (id) => { setProducts(prev => prev.filter(p => p.id !== id)); showNotification('Produit supprime !'); };
    const addEvent = (event) => { setEvents(prev => [...prev, { ...event, id: Date.now(), active: true }]); showNotification('Evenement ajoute !'); };
    const updateEvent = (id, updates) => { setEvents(prev => prev.map(e => e.id === id ? { ...e, ...updates } : e)); showNotification('Evenement mis a jour !'); };
    const deleteEvent = (id) => { setEvents(prev => prev.filter(e => e.id !== id)); showNotification('Evenement supprime !'); };
    const addPromo = (promo) => { setPromos(prev => [...prev, { ...promo, id: Date.now(), usageCount: 0, active: true }]); showNotification('Code promo ajoute !'); };
    const updatePromo = (id, updates) => { setPromos(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p)); showNotification('Code promo mis a jour !'); };
    const deletePromo = (id) => { setPromos(prev => prev.filter(p => p.id !== id)); showNotification('Code promo supprime !'); };
    const updateOrderStatus = (id, status) => { setOrders(prev => prev.map(o => o.id === id ? { ...o, status } : o)); showNotification('Statut mis a jour !'); };

    const value = { page, setPage, selectedProduct, setSelectedProduct, selectedCategory, setSelectedCategory, cart, addToCart, removeFromCart, updateCartQuantity, clearCart, cartTotal, cartCount, products, categories, events, promos, orders, isAdmin, setIsAdmin, cartOpen, setCartOpen, notification, showNotification, appliedPromo, applyPromoCode, getDiscountedTotal, placeOrder, addProduct, updateProduct, deleteProduct, addEvent, updateEvent, deleteEvent, addPromo, updatePromo, deletePromo, updateOrderStatus };
    return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};
const useApp = () => useContext(AppContext);

// COMPOSANTS UI
const Notification = () => { const { notification } = useApp(); if (!notification) return null; return (<div className={"fixed top-20 right-4 z-[100] px-6 py-3 rounded-xl shadow-lg animate-fadeIn text-white font-medium " + (notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-600')}>{notification.message}</div>); };
const Modal = ({ isOpen, onClose, title, children }) => { if (!isOpen) return null; return (<div className="fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-4" onClick={onClose}><div className="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto animate-fadeIn" onClick={e => e.stopPropagation()}><div className="p-6 border-b border-stone-100 flex justify-between items-center"><h3 className="font-editorial text-2xl text-emerald-950">{title}</h3><button onClick={onClose} className="p-2 hover:bg-stone-100 rounded-full transition"><XIcon size={20} /></button></div><div className="p-6">{children}</div></div></div>); };
const Button = ({ children, variant = 'primary', size = 'md', className = '', ...props }) => { const base = "font-medium rounded-full transition-all duration-300 flex items-center justify-center gap-2"; const variants = { primary: "bg-emerald-900 text-white hover:bg-emerald-800", secondary: "border border-emerald-900/20 text-emerald-900 hover:bg-emerald-50", danger: "bg-red-500 text-white hover:bg-red-600", ghost: "text-stone-600 hover:bg-stone-100" }; const sizes = { sm: "px-4 py-2 text-sm", md: "px-6 py-3 text-sm", lg: "px-8 py-4" }; return <button className={base + " " + variants[variant] + " " + sizes[size] + " " + className} {...props}>{children}</button>; };
const Input = ({ label, ...props }) => (<div className="mb-4">{label && <label className="block text-sm font-medium text-stone-700 mb-1">{label}</label>}<input className="w-full px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition" {...props} /></div>);
const Select = ({ label, options, ...props }) => (<div className="mb-4">{label && <label className="block text-sm font-medium text-stone-700 mb-1">{label}</label>}<select className="w-full px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition bg-white" {...props}>{options.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></div>);
const Textarea = ({ label, ...props }) => (<div className="mb-4">{label && <label className="block text-sm font-medium text-stone-700 mb-1">{label}</label>}<textarea className="w-full px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none" rows={4} {...props} /></div>);

// NAVIGATION
const Navigation = () => {
    const { page, setPage, cartCount, setCartOpen, isAdmin } = useApp();
    const [isMenuOpen, setIsMenuOpen] = useState(false);
    const [scrolled, setScrolled] = useState(false);
    useEffect(() => { const handleScroll = () => setScrolled(window.scrollY > 50); window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll); }, []);

    return (
        <nav className={"fixed top-0 left-0 right-0 z-50 transition-all duration-500 px-4 py-4 " + (scrolled ? 'py-2' : 'py-6')}>
            <div className={"max-w-7xl mx-auto rounded-full transition-all duration-500 " + (scrolled ? 'bg-white/90 backdrop-blur-md shadow-lg py-3 px-6' : 'bg-transparent py-2 px-0')}>
                <div className="flex justify-between items-center">
                    <div className="flex items-center gap-2 group cursor-pointer" onClick={() => { setPage('home'); setIsMenuOpen(false); }}>
                        <div className="w-8 h-8 bg-emerald-900 text-emerald-50 rounded-full flex items-center justify-center transform group-hover:rotate-12 transition duration-300"><Leaf size={14} /></div>
                        <span className="font-editorial font-bold text-xl text-emerald-950 tracking-tight">Greenez Vous</span>

r.total.toFixed(2)} EUR</p></div></div></div></div>))}</div>)}</div>)}
                    {activeTab === 'events' && (<div className="animate-fadeIn"><div className="flex justify-between items-center mb-8"><h2 className="font-editorial text-3xl text-emerald-950">Evenements</h2><Button onClick={() => openModal('event')}><Plus size={16} /> Ajouter</Button></div><div className="grid gap-4">{events.map(event => (<div key={event.id} className="bg-white rounded-2xl p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4"><div className="flex items-start gap-4"><div className="text-center bg-emerald-50 rounded-xl p-3 min-w-[70px]"><div className="text-2xl font-bold text-emerald-900">{new Date(event.date).getDate()}</div><div className="text-xs text-emerald-700 uppercase">{new Date(event.date).toLocaleDateString('fr-FR', { month: 'short' })}</div></div><div><h3 className="font-medium text-lg text-stone-900">{event.title}</h3><p className="text-stone-600 text-sm mb-1">{event.description}</p><p className="text-stone-500 text-sm flex items-center gap-1"><MapPin size={14} /> {event.location}</p></div></div><div className="flex items-center gap-2"><span className={"text-xs px-2 py-1 rounded-full " + (event.active ? 'bg-green-100 text-green-800' : 'bg-stone-100 text-stone-600')}>{event.active ? 'Actif' : 'Inactif'}</span><button onClick={() => openModal('event', event)} className="p-2 hover:bg-stone-100 rounded-lg text-stone-600"><Edit size={18} /></button><button onClick={() => deleteEvent(event.id)} className="p-2 hover:bg-red-50 rounded-lg text-red-500"><Trash size={18} /></button></div></div>))}</div></div>)}
                    {activeTab === 'promos' && (<div className="animate-fadeIn"><div className="flex justify-between items-center mb-8"><h2 className="font-editorial text-3xl text-emerald-950">Codes Promo</h2><Button onClick={() => openModal('promo')}><Plus size={16} /> Ajouter</Button></div><div className="bg-white rounded-2xl shadow-sm overflow-hidden"><table className="w-full"><thead className="bg-stone-50"><tr><th className="text-left px-6 py-4 text-sm font-medium text-stone-600">Code</th><th className="text-left px-6 py-4 text-sm font-medium text-stone-600">Reduction</th><th className="text-left px-6 py-4 text-sm font-medium text-stone-600">Min.</th><th className="text-left px-6 py-4 text-sm font-medium text-stone-600">Utilisations</th><th className="text-left px-6 py-4 text-sm font-medium text-stone-600">Statut</th><th className="text-right px-6 py-4 text-sm font-medium text-stone-600">Actions</th></tr></thead><tbody className="divide-y divide-stone-100">{promos.map(promo => (<tr key={promo.id} className="hover:bg-stone-50"><td className="px-6 py-4 font-mono font-bold text-emerald-700">{promo.code}</td><td className="px-6 py-4">{promo.discount}{promo.type === 'percent' ? '%' : ' EUR'}</td><td className="px-6 py-4">{promo.minOrder > 0 ? promo.minOrder + ' EUR' : '-'}</td><td className="px-6 py-4">{promo.usageCount} / {promo.maxUsage}</td><td className="px-6 py-4"><span className={"text-xs px-2 py-1 rounded-full " + (promo.active ? 'bg-green-100 text-green-800' : 'bg-stone-100 text-stone-600')}>{promo.active ? 'Actif' : 'Inactif'}</span></td><td className="px-6 py-4 text-right"><button onClick={() => openModal('promo', promo)} className="p-2 hover:bg-stone-100 rounded-lg text-stone-600"><Edit size={18} /></button><button onClick={() => deletePromo(promo.id)} className="p-2 hover:bg-red-50 rounded-lg text-red-500"><Trash size={18} /></button></td></tr>))}</tbody></table></div></div>)}
                </div>
            </div>
            <Modal isOpen={showModal && modalType === 'product'} onClose={closeModal} title={editingItem ? 'Modifier le produit' : 'Nouveau produit'}><ProductForm product={editingItem} onSave={editingItem ? (data) => { updateProduct(editingItem.id, data); closeModal(); } : (data) => { addProduct(data); closeModal(); }} categories={categories} onCancel={closeModal} /></Modal>
            <Modal isOpen={showModal && modalType === 'event'} onClose={closeModal} title={editingItem ? "Modifier l'evenement" : 'Nouvel evenement'}><EventForm event={editingItem} onSave={editingItem ? (data) => { updateEvent(editingItem.id, data); closeModal(); } : (data) => { addEvent(data); closeModal(); }} onCancel={closeModal} /></Modal>
            <Modal isOpen={showModal && modalType === 'promo'} onClose={closeModal} title={editingItem ? 'Modifier le code promo' : 'Nouveau code promo'}><PromoForm promo={editingItem} onSave={editingItem ? (data) => { updatePromo(editingItem.id, data); closeModal(); } : (data) => { addPromo(data); closeModal(); }} onCancel={closeModal} /></Modal>
        </div>
    );
};

// FORMULAIRES ADMIN
const ProductForm = ({ product, onSave, categories, onCancel }) => {
    const [form, setForm] = useState(product ? { ...product, price: String(product.price), stock: String(product.stock) } : { name: '', subtitle: '', description: '', price: '', stock: '', categoryId: categories[0]?.id || '', image: '', tag: '', active: true });
    const handleSubmit = (e) => { e.preventDefault(); onSave({ ...form, price: parseFloat(form.price), stock: parseInt(form.stock), categoryId: parseInt(form.categoryId) }); };
    return (<form onSubmit={handleSubmit}><Input label="Nom" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} /><Input label="Sous-titre" value={form.subtitle} onChange={e => setForm({...form, subtitle: e.target.value})} /><Textarea label="Description" value={form.description} onChange={e => setForm({...form, description: e.target.value})} /><div className="grid grid-cols-2 gap-4"><Input label="Prix (EUR)" type="number" step="0.01" required value={form.price} onChange={e => setForm({...form, price: e.target.value})} /><Input label="Stock" type="number" required value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} /></div><Select label="Categorie" value={form.categoryId} onChange={e => setForm({...form, categoryId: e.target.value})} options={categories.map(c => ({ value: c.id, label: c.name }))} /><Input label="URL Image" value={form.image} onChange={e => setForm({...form, image: e.target.value})} placeholder="https://..." /><Input label="Tag (optionnel)" value={form.tag || ''} onChange={e => setForm({...form, tag: e.target.value})} placeholder="Best-seller, Nouveau..." /><label className="flex items-center gap-2 mb-4 cursor-pointer"><input type="checkbox" checked={form.active} onChange={e => setForm({...form, active: e.target.checked})} className="w-4 h-4 text-emerald-600 rounded" /><span className="text-sm text-stone-700">Produit actif</span></label><div className="flex gap-4"><Button type="button" variant="secondary" onClick={onCancel}>Annuler</Button><Button type="submit" className="flex-1">{product ? 'Enregistrer' : 'Ajouter'}</Button></div></form>);
};
const EventForm = ({ event, onSave, onCancel }) => {
    const [form, setForm] = useState(event || { title: '', description: '', date: '', location: '', active: true });
    const handleSubmit = (e) => { e.preventDefault(); onSave(form); };
    return (<form onSubmit={handleSubmit}><Input label="Titre" required value={form.title} onChange={e => setForm({...form, title: e.target.value})} /><Textarea label="Description" value={form.description} onChange={e => setForm({...form, description: e.target.value})} /><Input label="Date" type="date" required value={form.date} onChange={e => setForm({...form, date: e.target.value})} /><Input label="Lieu" required value={form.location} onChange={e => setForm({...form, location: e.target.value})} /><label className="flex items-center gap-2 mb-4 cursor-pointer"><input type="checkbox" checked={form.active} onChange={e => setForm({...form, active: e.target.checked})} className="w-4 h-4 text-emerald-600 rounded" /><span className="text-sm text-stone-700">Evenement actif</span></label><div className="flex gap-4"><Button type="button" variant="secondary" onClick={onCancel}>Annuler</Button><Button type="submit" className="flex-1">{event ? 'Enregistrer' : 'Ajouter'}</Button></div></form>);
};
const PromoForm = ({ promo, onSave, onCancel }) => {
    const [form, setForm] = useState(promo ? { ...promo, discount: String(promo.discount), minOrder: String(promo.minOrder), maxUsage: String(promo.maxUsage) } : { code: '', discount: '', type: 'percent', minOrder: '0', maxUsage: '100', active: true });
    const handleSubmit = (e) => { e.preventDefault(); onSave({ ...form, code: form.code.toUpperCase(), discount: parseFloat(form.discount), minOrder: parseFloat(form.minOrder), maxUsage: parseInt(form.maxUsage) }); };
    return (<form onSubmit={handleSubmit}><Input label="Code" required value={form.code} onChange={e => setForm({...form, code: e.target.value.toUpperCase()})} placeholder="PROMO2024" /><div className="grid grid-cols-2 gap-4"><Input label="Reduction" type="number" step="0.01" required value={form.discount} onChange={e => setForm({...form, discount: e.target.value})} /><Select label="Type" value={form.type} onChange={e => setForm({...form, type: e.target.value})} options={[{ value: 'percent', label: 'Pourcentage (%)' }, { value: 'fixed', label: 'Montant fixe (EUR)' }]} /></div><div className="grid grid-cols-2 gap-4"><Input label="Commande min. (EUR)" type="number" value={form.minOrder} onChange={e => setForm({...form, minOrder: e.target.value})} /><Input label="Utilisations max." type="number" required value={form.maxUsage} onChange={e => setForm({...form, maxUsage: e.target.value})} /></div><label className="flex items-center gap-2 mb-4 cursor-pointer"><input type="checkbox" checked={form.active} onChange={e => setForm({...form, active: e.target.checked})} className="w-4 h-4 text-emerald-600 rounded" /><span className="text-sm text-stone-700">Code actif</span></label><div className="flex gap-4"><Button type="button" variant="secondary" onClick={onCancel}>Annuler</Button><Button type="submit" className="flex-1">{promo ? 'Enregistrer' : 'Ajouter'}</Button></div></form>);
};

// APP
const App = () => {
    const { page } = useApp();
    const renderPage = () => { switch(page) { case 'shop': return <ShopPage />; case 'product': return <ProductPage />; case 'events': return <EventsPage />; case 'about': return <AboutPage />; case 'checkout': return <CheckoutPage />; case 'login': return <LoginPage />; case 'admin': return <AdminDashboard />; default: return <HomePage />; } };
    return (<div className="min-h-screen overflow-x-hidden">{page !== 'admin' && <Navigation />}{renderPage()}<CartSidebar /><Notification /></div>);
};
const AppWrapper = () => (<AppProvider><App /></AppProvider>);
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppWrapper />);
    </script>
</body>
</html>
